<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">Rhon Jon G. Romero — Aspiring Full Stack Developer, General Santos City</title>
  <desc id="desc">White banner with green geometric shapes on both sides and Rhon Jon G. Romero's name in bold green letters.</desc>
  <defs>
    <clipPath id="frame">
      <rect width="1500" height="500" rx="28"/>
    </clipPath>
    <style>
      .name { font-family: 'Arial Black', 'Segoe UI Black', 'Helvetica Neue', Arial, sans-serif; font-weight: 900; }
      .sub { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; }

      /* Plays once on load, then holds the final frame. */
      .from-left  { animation: from-left 0.9s cubic-bezier(0.16, 1, 0.3, 1) both; }
      .from-right { animation: from-right 0.9s cubic-bezier(0.16, 1, 0.3, 1) both; }
      .rise-1 { animation: rise 0.8s 0.25s cubic-bezier(0.16, 1, 0.3, 1) both; }
      .rise-2 { animation: rise 0.8s 0.4s cubic-bezier(0.16, 1, 0.3, 1) both; }
      .rule {
        transform-box: fill-box;
        transform-origin: center;
        animation: draw 0.7s 0.75s cubic-bezier(0.65, 0, 0.35, 1) both;
      }
      .fade-1 { animation: fade 0.7s 1.1s ease-out both; }
      .fade-2 { animation: fade 0.7s 1.3s ease-out both; }

      @keyframes from-left  { from { transform: translateX(-260px); opacity: 0; } }
      @keyframes from-right { from { transform: translateX(260px);  opacity: 0; } }
      @keyframes rise { from { transform: translateY(40px); opacity: 0; } }
      @keyframes draw { from { transform: scaleX(0); } }
      @keyframes fade { from { opacity: 0; letter-spacing: 2px; } }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1500" height="500" fill="#ffffff"/>

    <!-- Left shapes -->
    <g class="from-left" fill="#12a12f">
      <rect x="-150" y="-60" width="270" height="270" transform="rotate(45 -15 75)"/>
      <rect x="150" y="190" width="110" height="110" transform="rotate(45 205 245)"/>
      <rect x="-120" y="270" width="230" height="230" transform="rotate(45 -5 385)"/>
      <rect x="120" y="440" width="140" height="140" transform="rotate(45 190 510)"/>
    </g>

    <!-- Right shapes -->
    <g class="from-right" fill="#12a12f">
      <rect x="1290" y="-90" width="150" height="150" transform="rotate(45 1365 -15)"/>
      <rect x="1380" y="40" width="270" height="270" transform="rotate(45 1515 175)"/>
      <rect x="1235" y="215" width="110" height="110" transform="rotate(45 1290 270)"/>
      <rect x="1350" y="330" width="250" height="250" transform="rotate(45 1475 455)"/>
    </g>

    <!-- Name -->
    <g class="name" fill="#12a12f" text-anchor="middle">
      <text class="rise-1" x="750" y="168" font-size="104" letter-spacing="-1">RHON JON G.</text>
      <text class="rise-2" x="750" y="282" font-size="104" letter-spacing="-1">ROMERO</text>
    </g>

    <rect class="rule" x="400" y="318" width="700" height="4" fill="#3d3d3d"/>

    <g class="sub" text-anchor="middle" fill="#3d3d3d">
      <text class="fade-1" x="750" y="372" font-size="30" letter-spacing="7">ASPIRING FULL STACK DEVELOPER</text>
      <text class="fade-2" x="750" y="418" font-size="22" letter-spacing="6" fill="#6b6b6b">GENERAL SANTOS CITY</text>
    </g>

    <rect width="1500" height="500" rx="28" fill="none" stroke="#e5e5e5" stroke-width="2"/>
  </g>
</svg>
