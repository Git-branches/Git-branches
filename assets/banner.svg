<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">Rhon Jon Romero — Full-Stack Web Developer</title>
  <desc id="desc">Banner with Rhon Jon Romero's name, role, location in General Santos City, and tech stack.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0f17"/>
      <stop offset="1" stop-color="#1a1b27"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36bcf7"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#36bcf7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#36bcf7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bb9af7" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#2a2e42"/>
    </pattern>
    <style>
      .sans { font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1500" height="500" fill="url(#bg)"/>
  <rect width="1500" height="500" fill="url(#dots)" opacity="0.7"/>
  <circle cx="230" cy="60" r="320" fill="url(#glowBlue)"/>
  <circle cx="1260" cy="470" r="360" fill="url(#glowPurple)"/>
  <rect x="0" y="494" width="1500" height="6" fill="url(#accent)"/>

  <!-- Left: intro -->
  <g class="sans">
    <rect x="652" y="82" width="196" height="38" rx="19" fill="#36bcf7" fill-opacity="0.12" stroke="#36bcf7" stroke-opacity="0.45"/>
    <circle cx="676" cy="101" r="5" fill="#9ece6a"/>
    <text x="690" y="107.5" font-size="16" font-weight="600" letter-spacing="1.6" fill="#7dcfff">OPEN TO WORK</text>

    <text x="750" y="208" text-anchor="middle" font-size="84" font-weight="800" fill="#e6e9f5" letter-spacing="-1.5">Rhon Jon Romero</text>
    <text x="750" y="262" text-anchor="middle" font-size="38" font-weight="700" fill="url(#accent)">Full-Stack Web Developer</text>

    <g fill="#9aa5ce" font-size="21" transform="translate(480 0)">
      <path d="M100 291c-6.6 0-12 5.2-12 11.6 0 8.7 12 21.4 12 21.4s12-12.7 12-21.4c0-6.4-5.4-11.6-12-11.6zm0 15.8a4.3 4.3 0 1 1 0-8.6 4.3 4.3 0 0 1 0 8.6z" fill="#f7768e"/>
      <text x="122" y="310">General Santos City, Philippines</text>
    </g>

    <g font-size="17" font-weight="600" transform="translate(372 0)">
      <rect x="90" y="352" width="76" height="40" rx="10" fill="#777bb4" fill-opacity="0.18" stroke="#777bb4" stroke-opacity="0.6"/>
      <text x="128" y="378" text-anchor="middle" fill="#b9bce8">PHP</text>

      <rect x="178" y="352" width="128" height="40" rx="10" fill="#f7df1e" fill-opacity="0.12" stroke="#f7df1e" stroke-opacity="0.5"/>
      <text x="242" y="378" text-anchor="middle" fill="#f3e47a">JavaScript</text>

      <rect x="318" y="352" width="96" height="40" rx="10" fill="#4479a1" fill-opacity="0.22" stroke="#4479a1" stroke-opacity="0.8"/>
      <text x="366" y="378" text-anchor="middle" fill="#9cc3e4">MySQL</text>

      <rect x="426" y="352" width="140" height="40" rx="10" fill="#06b6d4" fill-opacity="0.14" stroke="#06b6d4" stroke-opacity="0.6"/>
      <text x="496" y="378" text-anchor="middle" fill="#7ee0ef">Tailwind CSS</text>

      <rect x="578" y="352" width="88" height="40" rx="10" fill="#61dafb" fill-opacity="0.12" stroke="#61dafb" stroke-opacity="0.5"/>
      <text x="622" y="378" text-anchor="middle" fill="#a8ecfd">React</text>
    </g>

    <text x="750" y="438" text-anchor="middle" font-size="19" fill="#565f89">I build clean, fast web apps — from the database to the pixels.</text>
  </g>
</svg>
